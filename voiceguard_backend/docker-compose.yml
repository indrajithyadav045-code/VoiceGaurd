version: '3.8'

services:
  voiceguard-backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    shm_size: '2gb' # Critical for PyTorch worker safety
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
